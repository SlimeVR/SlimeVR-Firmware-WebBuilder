services:
  db:
    image: "postgres:18"
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - 5432
    volumes:
      - db-volume:/var/lib/postgresql
    networks:
      - slimevr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
    ports:
      - 127.0.0.1:3000:3000
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./drizzle:/app/drizzle
      - ./sources.json:/data/sources.json
    networks:
      - slimevr-network
    secrets:
      - access_key
      - secret_key
    environment:
      APP_ENV: development
      SUPPORTED_VERSIONS: ${SUPPORTED_VERSIONS}
      GITHUB_AUTH_KEY: ${GITHUB_AUTH_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: http://s3:9099
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      SOURCES_JSON_PATH: /data/sources.json
  s3:
    image: rustfs/rustfs:1.0.4
    user: "0:0"
    restart: always
    volumes:
      - storage-s3:/data
    secrets:
      - access_key
      - secret_key
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9099
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/secret_key
    ports:
      - 127.0.0.1:9099:9099
      - 127.0.0.1:9000:9000
    networks:
      - slimevr-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9099/health"]
      interval: 5s
      timeout: 5s
      retries: 10
  s3-init:
    image: amazon/aws-cli:2.38.6
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - slimevr-network
    secrets:
      - access_key
      - secret_key
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: http://s3:9099
    volumes:
      - ./docker/s3/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

volumes:
  db-volume:
  storage-s3:

secrets:
  access_key:
    file: ./docker/s3/access_key.txt
  secret_key:
    file: ./docker/s3/secret_key.txt

networks:
  slimevr-network:
